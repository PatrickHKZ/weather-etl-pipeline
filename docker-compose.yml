services:

  postgres:
    image: postgres:18

    container_name: weather_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: weather_dw

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weather_dw"]
      interval: 10s
      timeout: 5s
      retries: 5


  etl:
    build: .

    container_name: weather_etl

    env_file:
      - .env.docker

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - .:/app

    command: tail -f /dev/null


volumes:
  postgres_data: